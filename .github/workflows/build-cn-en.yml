name: build-cn-en

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build cn_en.m3u
        shell: python3 {0}
        run: |
          import urllib.request

          COUNTRIES = [
              ("cn", "中国"),
              ("us", "美国"),
              ("uk", "英国"),
              ("au", "澳大利亚"),
              ("ca", "加拿大"),
          ]

          BASE_URL = "https://raw.githubusercontent.com/iptv-org/iptv/master/streams/{code}.m3u"

          total = 0
          lines = [
              "#EXTM3U",
              "# ===== custom IPTV source: Chinese + English channels =====",
              "# source: iptv-org/iptv (auto-build)",
          ]

          for code, label in COUNTRIES:
              url = BASE_URL.format(code=code)
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  resp = urllib.request.urlopen(req, timeout=30)
                  content = resp.read().decode("utf-8")
              except Exception as e:
                  print(f"download failed {label}: {e}")
                  continue

              count = 0
              for line in content.splitlines():
                  line = line.strip()
                  if line.startswith("#EXTINF:"):
                      if 'group-title="' not in line and "," in line:
                          channel_name = line.rsplit(",", 1)[1].strip()
                          line = line.rsplit(",", 1)[0] + f' group-title="{label}",{channel_name}'
                      lines.append(line)
                      count += 1
                  elif line.startswith("http"):
                      lines.append(line)
              print(f"ok {label}: {count} channels")
              total += count

          output = "\n".join(lines)
          with open("cn_en.m3u", "w", encoding="utf-8") as f:
              f.write(output)

          print(f"\ntotal: {total} channels, {len(output)/1024:.0f} KB")          

      - name: Commit & push
        run: |
          git config user.name "summitdoudou"
          git config user.email "summitdoudou@users.noreply.github.com"
          git add cn_en.m3u
          if git diff --cached --quiet; then
            echo "No changes, skip commit"
          else
            git commit -m "auto-update cn_en.m3u [$(date -u '+%Y-%m-%d')]"
            git push
          fi  
